name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: nuget restore XmlComplex.sln

      - name: Build (Release)
        run: msbuild XmlComplex.sln /p:Configuration=Release /p:Platform=AnyCPU

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path .\bin\Release\* -DestinationPath .\artifacts\XmlComplex-${{ github.ref_name }}.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .\artifacts\XmlComplex-${{ github.ref_name }}.zip
          generate_release_notes: true
