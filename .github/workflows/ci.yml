name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution packages
        run: nuget restore XmlComplex.sln

      - name: Restore test project packages
        run: dotnet restore Tests/Tests.csproj

      - name: Build app (Release)
        run: msbuild App/App.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Run tests (Release)
        run: dotnet test Tests/Tests.csproj --configuration Release --no-restore --verbosity normal
