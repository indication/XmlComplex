name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format. Actual: $VERSION" >&2
            exit 1
          fi

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create release branch and update application version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          build_number=$(date +%s)
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          release_branch="release/v${VERSION}.${build_number}"
          git switch --create "$release_branch"
          assembly_version="${VERSION}.${build_number}"
          assembly_info="App/Properties/AssemblyInfo.cs"
          for attribute in AssemblyVersion AssemblyFileVersion; do
            count=$(grep -c "^\[assembly: ${attribute}(\"" "$assembly_info")
            if [[ "$count" -ne 1 ]]; then
              echo "Expected one ${attribute} attribute; found ${count}." >&2
              exit 1
            fi
            sed -i -E "s|^(\\[assembly: ${attribute}\\(\")[^\"]+(\"\\)\\]\s*)$|\1${assembly_version}\2|" "$assembly_info"
            if ! grep -Fq "[assembly: ${attribute}(\"${assembly_version}\")]" "$assembly_info"; then
              echo "Failed to set ${attribute} to ${assembly_version}." >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/Properties/AssemblyInfo.cs
          git commit -m "chore(release): bump assembly version to v${VERSION}.${build_number}"
          git push --set-upstream origin "$release_branch"

      - name: Create release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${VERSION}.${BUILD_NUMBER}" \
            --title "Release v${VERSION}.${BUILD_NUMBER}" \
            --body $'## Release PR\n\n- Source branch: release/v'"${VERSION}.${BUILD_NUMBER}"$'\n- Target branch: main\n\nMerged PR will trigger the tag workflow.'
