name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch name (e.g. release/v1.2.3)'
        required: true
      base_branch:
        description: 'Base branch to merge into'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create or reuse release PR
        uses: actions/github-script@v8
        with:
          script: |
            const releaseBranch = core.getInput('release_branch').trim();
            const baseBranch = core.getInput('base_branch').trim();

            if (!releaseBranch.startsWith('release/v')) {
              core.setFailed(`release_branch must start with 'release/v'. actual: ${releaseBranch}`);
              return;
            }

            const head = `${context.repo.owner}:${releaseBranch}`;

            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              base: baseBranch
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.notice(`Open PR already exists: #${pr.number} ${pr.html_url}`);
              core.setOutput('pull_request_url', pr.html_url);
              return;
            }

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${baseBranch}...${releaseBranch}`
            });

            if (compare.data.total_commits === 0) {
              core.setFailed(`No differences found between ${baseBranch} and ${releaseBranch}.`);
              return;
            }

            const version = releaseBranch.replace(/^release\//, '');

            const created = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${version}`,
              head: releaseBranch,
              base: baseBranch,
              body: [
                '## Release PR',
                '',
                `- Source branch: ${releaseBranch}`,
                `- Target branch: ${baseBranch}`,
                '',
                'Merged PR will trigger the tag workflow.'
              ].join('\n')
            });

            core.notice(`Created PR: #${created.data.number} ${created.data.html_url}`);
            core.setOutput('pull_request_url', created.data.html_url);
